# Memo Labs — guarded unattended Mergify landing, new low-risk agent PRs ONLY.
# Older/open PRs, critical paths, drafts and failed CI cannot auto-queue.
merge_queue:
  max_parallel_checks: 1

merge_protections_settings:
  auto_merge_conditions:
    - "base = main"
    - "-draft"
    - "-from-fork"
    - "author = memo-labs-automation[bot]"
    - "created-at >= 2026-10-16T17:30:00Z"
    - "label != hold-merge"
    - "label != needs-human-review"
    - "#files <= 8"
    - "#added-lines <= 400"
    - "#deleted-lines <= 150"
    - '-files ~= ^(\.github/|\.mergify\.yml$|server/|bridge/|plugin/|deploy/|scripts/|tests/|infra/|config/|\.env|AGENTS\.md$|CODEOWNERS$|Dockerfile|package\.json$|pnpm-lock\.yaml$)'
    - "check-success = @github-actions/test (22)"
    - "check-success = @github-actions/test (24)"

queue_rules:
  - name: memo-labs-safe-auto
    batch_size: 1
    merge_method: squash
    queue_conditions: &safe_auto_conditions
      - "base = main"
      - "-draft"
      - "-from-fork"
      - "author = memo-labs-automation[bot]"
      - "created-at >= 2026-10-16T17:30:00Z"
      - "label != hold-merge"
      - "label != needs-human-review"
      - "#files <= 8"
      - "#added-lines <= 400"
      - "#deleted-lines <= 150"
      - '-files ~= ^(\.github/|\.mergify\.yml$|server/|bridge/|plugin/|deploy/|scripts/|tests/|infra/|config/|\.env|AGENTS\.md$|CODEOWNERS$|Dockerfile|package\.json$|pnpm-lock\.yaml$)'
      - "check-success = @github-actions/test (22)"
      - "check-success = @github-actions/test (24)"
    merge_conditions: *safe_auto_conditions
