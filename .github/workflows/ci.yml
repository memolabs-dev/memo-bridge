name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    env:
      # The Coordinator runs the canonical lease ledger of memolabs-dev/.github; tests drive it
      # offline through tests/helpers/fake-gh and must fail rather than skip when it is missing.
      MEMO_BRIDGE_GOVERNANCE_ROOT: ${{ github.workspace }}/governance
      MEMO_BRIDGE_REQUIRE_GOVERNANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check out the canonical lease ledger (read-only, never executed against GitHub)
        uses: actions/checkout@v4
        with:
          repository: memolabs-dev/.github
          ref: main
          path: governance
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
