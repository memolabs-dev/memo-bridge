[verifiers."invariant.worktree-exclusive"]
run = 'o=$(mktemp) || exit 1; MEMO_BRIDGE_REQUIRE_GOVERNANCE=1 node --test tests/invariants/worktree-race.test.mjs >"$o" 2>&1; s=$?; tail -c 2000 "$o"; rm -f "$o"; exit $s'
files = [
  "tests/invariants/worktree-race.test.mjs",
  "tests/invariants/lib/**",
  "server/**",
  "bridge/**",
  "package.json",
