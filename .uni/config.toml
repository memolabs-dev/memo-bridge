[verifiers."invariant.lock-exclusive"]
run = 'o=$(mktemp) || exit 1; MEMO_BRIDGE_REQUIRE_GOVERNANCE=1 node --test tests/invariants/lock-race.test.mjs >"$o" 2>&1; s=$?; tail -c 2000 "$o"; rm -f "$o"; exit $s'
files = [
  "tests/invariants/lock-race.test.mjs",
  "tests/invariants/lib/**",
  "server/**",
  "bridge/**",
  "package.json",
  "pnpm-lock.yaml",
]
timeout = 900

[verifiers."invariant.mutants-killed"]
run = 'o=$(mktemp) || exit 1; MEMO_BRIDGE_REQUIRE_GOVERNANCE=1 node tests/mutations/run.mjs >"$o" 2>&1; s=$?; tail -c 2000 "$o"; rm -f "$o"; exit $s'
files = [
  "tests/mutations/**",
  "tests/invariants/**",
  "server/**",
  "bridge/**",
  "package.json",
  "pnpm-lock.yaml",
]
timeout = 2400

# GitHub Actions OIDC: the only issuer whose token may lift a proof to A3. Keys are pinned beside
# the registry and never fetched at verification time (copied from uni's
# examples/identity-github-actions, checked against GitHub's live JWKS on 2026-10-19).
[identities."https://token.actions.githubusercontent.com"]
source = "oidc"
jwks_file = ".uni/identity/github.jwks.json"
audiences = ["uni-cli"]
algorithms = ["RS256"]
